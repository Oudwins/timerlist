name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK (disable for a build benchmark)
        type: boolean
        default: true

permissions:
  contents: write

# Serialize releases so simultaneous pushes cannot choose the same patch number.
# Keep queued pushes rather than replacing them with the newest push.
concurrency:
  group: android-releases
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_PCH_EXTSUM: 'true'
      CCACHE_MAXSIZE: 2GiB
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify Android signing configuration
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo '::error::Run npm run setup:android-signing -- --github once. No Expo account is needed. See README.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
      - name: Set release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          node scripts/prepare-release.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - name: Reclaim hosted-runner disk and install Android SDK
        run: |
          df -h "$GITHUB_WORKSPACE"
          node scripts/setup-ci-android-sdk.mjs
          df -h "$GITHUB_WORKSPACE"
      - name: Check runner disk before restoring build inputs
        run: |
          available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1)
          if (( available < 20 * 1024 * 1024 * 1024 )); then
            echo '::error::Native builds require at least 20 GiB free before restoring build inputs.'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate native Android project locally
        run: npm run prebuild:android
      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          mkdir -p "$RUNNER_TEMP/timerlist-ccache"
          echo "CCACHE_DIR=$RUNNER_TEMP/timerlist-ccache" >> "$GITHUB_ENV"
          ccache --version
          nproc
          free -h
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-android-ccache-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-android-ccache-v1-${{ hashFiles('package-lock.json') }}-
      - name: Check native build disk budget
        run: |
          df -h "$GITHUB_WORKSPACE"
          available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1)
          if (( available < 16 * 1024 * 1024 * 1024 )); then
            echo '::error::Native builds require at least 16 GiB of free working disk after restoring caches.'
            exit 1
          fi
      - name: Build standalone release APK
        id: android-build
        working-directory: android
        run: |
          ccache --zero-stats
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --build-cache --parallel --profile \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
      - name: Report native compiler cache usage
        if: ${{ always() && (steps.android-build.outcome == 'success' || steps.android-build.outcome == 'failure') }}
        run: |
          df -h "$GITHUB_WORKSPACE"
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save native build timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-profile
          path: android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7
      - name: Sign and verify APK
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: npm run sign:android
      - name: Verify package and version for Obtainium
        run: node scripts/verify-apk.mjs
      - name: Save APK
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: timerlist-apk
          path: timerlist.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" timerlist.apk \
            --title "$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --generate-notes \
            --notes "Download **timerlist.apk** to install on Android. For automatic updates with Obtainium, add https://github.com/Oudwins/timerlist as the app source."
