name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so simultaneous pushes cannot choose the same patch number.
# Keep queued pushes rather than replacing them with the newest push.
concurrency:
  group: android-releases
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify Android signing configuration
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo '::error::Run npm run setup:android-signing -- --github once. No Expo account is needed. See README.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
      - name: Set release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          node scripts/prepare-release.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platform-tools" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate native Android project locally
        run: npm run prebuild:android
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Sign and verify APK
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: npm run sign:android
      - name: Verify package and version for Obtainium
        run: node scripts/verify-apk.mjs
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: timerlist-apk
          path: timerlist.apk
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" timerlist.apk \
            --title "$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --generate-notes \
            --notes "Download **timerlist.apk** to install on Android. For automatic updates with Obtainium, add https://github.com/Oudwins/timerlist as the app source."
